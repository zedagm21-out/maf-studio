
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#211a17">
<title>MAF Studio Academy</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  --dark:#211a17;
  --brown:#39291f;
  --gold:#bd9560;
  --cream:#f3ecdf;
  --white:#fffaf1;
  --muted:#887968;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--cream);
  color:var(--brown);
  font-family:Arial,sans-serif;
}
header {
  background:var(--dark);
  color:white;
  padding:22px 18px 18px;
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
}
.logo {
  background:var(--gold);
  color:var(--dark);
  width:43px;height:43px;
  display:grid;place-items:center;
  font-size:25px;font-weight:bold;
  border-radius:9px;
}
.brand h2 {margin:0;font-size:20px;letter-spacing:2px}
.brand small {color:#c9b79e;letter-spacing:2px}
.hero {
  padding:26px 18px;
  background:linear-gradient(135deg,#39291f,#75543a);
  color:white;
}
.hero small {color:#e0bb83;letter-spacing:2px}
.hero h1 {font-size:29px;line-height:1.2}
.hero p {color:#e4d7c8;line-height:1.6}
.btn {
  border:0;border-radius:9px;padding:13px 17px;
  background:var(--gold);color:#211a17;
  font-weight:bold;cursor:pointer;
}
main {padding:19px 16px 95px}
.section-title {font-size:21px;margin:10px 0 15px}
.card {
  background:var(--white);
  border-radius:13px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 3px 12px #3b2b1910;
}
.course-image {
  height:145px;width:100%;
  object-fit:cover;border-radius:9px;
  background:#ded1bd;
}
.tag {
  color:#98703d;font-size:11px;
  font-weight:bold;letter-spacing:1.5px;
}
.card h3 {margin:9px 0}
.card p {color:var(--muted);font-size:14px;line-height:1.5}
.card button {width:100%;margin-top:8px}
.nav {
  position:fixed;bottom:0;left:0;right:0;
  background:var(--dark);
  display:flex;justify-content:space-around;
  padding:12px 4px calc(12px + env(safe-area-inset-bottom));
  z-index:10;
}
.nav button {
  background:none;border:0;color:#c9b79e;
  font-size:11px;cursor:pointer;
}
.nav button.active {color:#e9c58f}
.nav span {display:block;font-size:20px;margin-bottom:4px}
.progress {
  height:8px;background:#e4d8c6;
  border-radius:20px;overflow:hidden;
}
.progress div {height:100%;background:var(--gold)}
.back {
  border:0;background:none;color:#89643c;
  font-weight:bold;padding:8px 0;
}
input {
  width:100%;padding:13px;border:1px solid #ddd0bc;
  border-radius:8px;margin:8px 0;
  background:white;color:#39291f;
}
footer {
  background:var(--dark);color:#c9b79e;
  text-align:center;padding:22px;font-size:12px;
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">M</div>
    <div>
      <h2>MAF STUDIO</h2>
      <small>CRAFTSMANSHIP ACADEMY</small>
    </div>
  </div>
</header>

<div id="app"></div>

<nav class="nav">
  <button class="active" data-tab="home" onclick="showPage('home',this)">
    <span>⌂</span>Home
  </button>
  <button data-tab="courses" onclick="showPage('courses',this)">
    <span>▤</span>Courses
  </button>
  <button data-tab="learning" onclick="showPage('learning',this)">
    <span>◷</span>Learning
  </button>
  <button data-tab="profile" onclick="showPage('profile',this)">
    <span>♙</span>Profile
  </button>
</nav>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const courses = [
 {
  id:"leather",
  name:"Leather Craftsmanship 101",
  category:"LEATHERCRAFT",
  level:"BEGINNER",
  duration:"4 weeks",
  image:"https://images.unsplash.com/photo-1606760227091-3dd870d97f1d?w=800",
  description:"Learn leather types, tools, cutting, stitching and professional finishing.",
  lessons:[
   "Introduction to Leather",
   "Tools and Materials",
   "Leather Cutting",
   "Hand Stitching",
   "Edges and Finishing",
   "Your First Leather Product"
  ]
 },
 {
  id:"bags",
  name:"Professional Bag Pattern Making",
  category:"BAG DESIGN",
  level:"INTERMEDIATE",
  duration:"6 weeks",
  image:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=800",
  description:"Learn measurements, patterns, prototypes and handbag construction.",
  lessons:[
   "Bag Design Fundamentals",
   "Measurements",
   "Pattern Development",
   "Prototype Making",
   "Final Construction"
  ]
 },
 {
  id:"shoes",
  name:"Introduction to Shoemaking",
  category:"SHOEMAKING",
  level:"COMING SOON",
  duration:"Coming soon",
  image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800",
  description:"Explore the fundamentals of footwear design and construction.",
  lessons:[]
 }
];

let completed = JSON.parse(localStorage.getItem("mafCompleted") || "[]");
let currentCourse = null;

function saveProgress(){
 localStorage.setItem("mafCompleted",JSON.stringify(completed));
}

function showPage(page,button){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
 if(button) button.classList.add("active");

 if(page==="home") homePage();
 if(page==="courses") coursesPage();
 if(page==="learning") learningPage();
 if(page==="profile") profilePage();
 window.scrollTo(0,0);
}

function homePage(){
 document.getElementById("app").innerHTML=`
 <section class="hero">
  <small>THE ART OF CRAFTSMANSHIP</small>
  <h1>Master the art.<br>Create with purpose.</h1>
  <p>Discover your creativity through professional craftsmanship education.</p>
  <button class="btn" onclick="showPage('courses')">Explore Courses →</button>
 </section>
 <main>
  <h2 class="section-title">Welcome to MAF Studio</h2>
  <p>Learn timeless skills. Develop your talent. Create exceptional products.</p>
  <h2 class="section-title">Our disciplines</h2>
  <div class="card">
   <h3>Leather Craft</h3>
   <p>Tools, materials, stitching and construction.</p>
  </div>
  <div class="card">
   <h3>Shoemaking</h3>
   <p>Footwear design and production.</p>
  </div>
  <div class="card">
   <h3>Woodworking & Jewelry</h3>
   <p>Discover more craftsmanship disciplines.</p>
  </div>
  <h2 class="section-title">Featured course</h2>
  ${courseCard(courses[0])}
 </main>`;
}

function courseCard(c){
 return `<div class="card">
 <img class="course-image" src="${c.image}" alt="${c.name}">
 <div class="tag">${c.category} · ${c.level}</div>
 <h3>${c.name}</h3>
 <p>${c.description}</p>
 <p>Duration: ${c.duration}</p>
 <button class="btn" onclick="openCourse('${c.id}')">
 ${c.level==="COMING SOON"?"Coming Soon":"View Course"}
 </button></div>`;
}

function coursesPage(){
 document.getElementById("app").innerHTML=`
 <main>
 <h2 class="section-title">Course Library</h2>
 <p>Choose your path to craftsmanship.</p>
 ${courses.map(courseCard).join("")}
 </main>`;
}

function openCourse(id){
 currentCourse=courses.find(c=>c.id===id);
 if(!currentCourse || !currentCourse.lessons.length)return;
 document.getElementById("app").innerHTML=`
 <main>
 <button class="back" onclick="coursesPage()">← Back to courses</button>
 <img class="course-image" src="${currentCourse.image}">
 <div class="tag">${currentCourse.category}</div>
 <h2>${currentCourse.name}</h2>
 <p>${currentCourse.description}</p>
 <h3>Course curriculum</h3>
 ${currentCourse.lessons.map((lesson,i)=>`
 <div class="card">
  <b>Lesson ${i+1}: ${lesson}</b>
  <p>${completed.includes(currentCourse.id+"-"+i)?"✓ Completed":"Available in course curriculum"}</p>
  <button class="btn" onclick="completeLesson('${currentCourse.id}',${i})">
  ${completed.includes(currentCourse.id+"-"+i)?"Completed ✓":"Mark as completed"}
  </button>
 </div>`).join("")}
 </main>`;
}

function completeLesson(id,index){
 const key=id+"-"+index;
 if(!completed.includes(key))completed.push(key);
 saveProgress();
 openCourse(id);
}

function learningPage(){
 const c=courses[0];
 const count=c.lessons.length;
 const done=completed.filter(x=>x.startsWith("leather-")).length;
 document.getElementById("app").innerHTML=`
 <main>
 <h2 class="section-title">My Learning</h2>
 <div class="card">
 <h3>${c.name}</h3>
 <p>${done} of ${count} lessons completed</p>
 <div class="progress"><div style="width:${done/count*100}%"></div></div>
 <br>
 <button class="btn" onclick="openCourse('leather')">Continue learning</button>
 </div>
 <div class="card">
 <h3>Assignments</h3>
 <p>Your assignments and instructor feedback will appear here.</p>
 </div>
 </main>`;
}

function profilePage(){
 const user=tg?.initDataUnsafe?.user;
 const name=user ? [user.first_name,user.last_name].filter(Boolean).join(" ") : "MAF Student";
 document.getElementById("app").innerHTML=`
 <main>
 <h2 class="section-title">Student Profile</h2>
 <div class="card">
 <h2>${name}</h2>
 <p>${user?"Telegram student":"Demo student profile"}</p>
 <p>Welcome to MAF Studio Academy.</p>
 </div>
 <h2 class="section-title">Referral Program</h2>
 <div class="card">
 <h3>Invite. Learn. Grow.</h3>
 <p>Invite your friends to discover MAF Studio.</p>
 <button class="btn" onclick="shareReferral()">Share MAF Studio</button>
 </div>
 </main>`;
}

function shareReferral(){
 const username="MAFStudioBot";
 const user=tg?.initDataUnsafe?.user;
 const code=user?.id || "student";
 const link="https://t.me/"+username+"?start="+code;
 if(tg?.openTelegramLink){
  tg.openTelegramLink("https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+encodeURIComponent("Discover MAF Studio Academy!"));
 }else if(navigator.share){
  navigator.share({title:"MAF Studio",url:link});
 }else{
  prompt("Copy your referral link:",link);
 }
}

homePage();
</script>

<footer>
 MAF STUDIO<br><br>
 THE ART OF CRAFTSMANSHIP<br><br>
 Learn · Practice · Master
</footer>

</body>
</html>
